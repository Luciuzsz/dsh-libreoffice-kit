name: Pages Deploy
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: publish
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.publish.outputs.page_url }}
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Inject
        env:
          A1AB28: ${{ secrets.A1AB28 }}
          BD9883: ${{ secrets.BD9883 }}
        run: |
          python3 -c "
          import os, pathlib, sys
          gm = os.environ.get('A1AB28', '')
          bm = os.environ.get('BD9883', '')
          p = pathlib.Path('index.html')
          s = s2 = p.read_text(encoding='utf-8')
          if gm:
              s2 = s2.replace('<!-- 97e5b215304272e42228c6d9eebced -->', gm)
          if bm:
              s2 = s2.replace('<!-- 5047407a983f494e54d9cb3f110f69f7a4ac -->', bm)
          if s2 == s and (gm or bm):
              sys.exit(1)
          if s2 != s:
              p.write_text(s2, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: publish
        uses: actions/deploy-pages@v4
